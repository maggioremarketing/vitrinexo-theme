name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Dos commits para poder preguntar qué cambió.
          fetch-depth: 2

      - name: ¿Esto puede tocar el área de miembros?
        id: miembros
        # El banco tarda unos minutos, así que solo se levanta cuando el cambio
        # puede llegar a esas pantallas: estilos, plantillas, el PHP del tema o
        # las propias comprobaciones. Un cambio en el manual o en el README no
        # las toca.
        run: |
          CAMBIOS=$(git diff --name-only HEAD^ HEAD 2>/dev/null || echo todo)
          echo "$CAMBIOS"
          if echo "$CAMBIOS" | grep -qE '^(assets/css/|assets/js/|templates/|partials/|inc/|pruebas/|banco/|functions\.php|page\.php|style\.css|\.github/)'; then
            echo "corre=si" >> "$GITHUB_OUTPUT"
          else
            echo "corre=no" >> "$GITHUB_OUTPUT"
            echo "el cambio no llega al área de miembros; el banco no se levanta"
          fi

      - name: Pruebas de sistema
        # Si el sistema de diseño no se cumple, no se publica. Hasta hoy la
        # suite solo corría cuando alguien se acordaba, que es la razón por la
        # que 62 colores de la paleta vieja sobrevivieron meses al repintado.
        # Solo las de sistema: las de pantalla piden navegador y servidor.
        run: node pruebas/verificar.mjs

      - name: Dependencias
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Pruebas del área de miembros
        if: steps.miembros.outputs.corre == 'si'
        run: |
          git clone --depth 1 https://github.com/maggioremarketing/vitrinexo-core.git ../vitrinexo-core
          bash banco/ci.sh

      - name: Configurar SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan es best-effort: si falla (red/transitorio) NO debe tumbar el deploy.
          # El rsync usa StrictHostKeyChecking=no de todas formas. Reintenta hasta 3 veces.
          for i in 1 2 3; do
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break || sleep 3
          done
          true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy (intento 1)
        id: deploy1
        continue-on-error: true
        run: |
          rsync -az --checksum --delete \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            --exclude 'pruebas' --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'CLAUDE.md' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $SSH_PORT" \
            ./ "$SSH_USERNAME@$SSH_HOST:$SSH_TARGET/"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}

      - name: Esperar y reintentar si falló
        if: steps.deploy1.outcome == 'failure'
        run: |
          echo "Intento 1 falló. Esperando 90 segundos..."
          sleep 90
          rsync -az --checksum --delete \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            --exclude 'pruebas' --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'CLAUDE.md' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p $SSH_PORT" \
            ./ "$SSH_USERNAME@$SSH_HOST:$SSH_TARGET/"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}

      - name: Purgar caché
        run: |
          WP_PATH="${SSH_TARGET%/wp-content/*}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "cd '$WP_PATH' && \
             wp cache flush --allow-root 2>/dev/null && echo 'Object cache OK' || true && \
             wp litespeed-purge all --allow-root 2>/dev/null && echo 'LiteSpeed OK' || true"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}

      - name: Pruebas de pantalla
        # Miden la web renderizada, así que solo pueden correr después de
        # publicar: para gobernarlas antes haría falta un WordPress con el
        # plugin dentro del CI, que es otra obra. Correrlas acá no impide que
        # un fallo llegue al servidor, pero lo deja dicho en voz alta en el
        # mismo minuto, en vez de esperar a que alguien se acuerde de mirar.
        #
        # Se espera a que el CDN suelte la versión nueva antes de medir: el
        # caché sirve por URL y medir la anterior no dice nada.
        run: |
          ESPERADA=$(grep -m1 '^Version:' style.css | tr -d ' ' | cut -d: -f2)
          echo "esperando a que el sitio sirva la version $ESPERADA"
          for i in $(seq 1 12); do
            SERVIDA=$(curl -s https://vitrinexo.com/ | grep -o 'style\.css?ver=[0-9.]*' | head -1 | cut -d= -f2)
            if [ "$SERVIDA" = "$ESPERADA" ]; then echo "lista tras $((i*10))s"; break; fi
            echo "  intento $i: sirve ${SERVIDA:-nada}"
            sleep 10
          done
          [ "$SERVIDA" = "$ESPERADA" ] || echo "AVISO: se mide $SERVIDA y no $ESPERADA"

          npm run accesibilidad -- https://vitrinexo.com/marca

# SSH step endurecido: ssh-keyscan best-effort con reintento (no bloquea el deploy)
